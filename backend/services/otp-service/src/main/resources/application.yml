server:
  port: ${PORT:8090}

spring:
  config:
    import: classpath:application-common.yml
  application:
    name: otp-service
  datasource:
    url: jdbc:${OTP_DB_URL:postgresql://localhost:5432/otp_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false  # Temporarily disable validation
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
      default-encoding: UTF-8
  esms:
    username: ${ESMS_USERNAME:your_username}
    password: ${ESMS_PASSWORD:your_password}
    sender-alias: ${ESMS_SENDER_ALIAS:Godayana.lk}
    message-type: 1  # 0 = Normal, 1 = Promotional
    session-timeout: 240000  # 4 minutes in milliseconds

otp:
  length: 4
  expiration-minutes: 5
  max-attempts: 3

logging:
  level:
    com.godayana: DEBUG

eureka:
  client:
    enabled: false  # Disable Eureka for local development
    register-with-eureka: false
    fetch-registry: false