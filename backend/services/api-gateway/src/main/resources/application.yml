server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${CONNECT_TIMEOUT:10000}
        response-timeout: ${RESPONSE_TIMEOUT:120s}
        pool:
          max-connections: ${MAX_CONNECTIONS:500}
          max-connections-per-route: ${MAX_CONNECTIONS_PER_ROUTE:100}
          max-idle-time: 30s
          acquire-timeout: 10000
      default-filters:
        - name: DedupeResponseHeader
          args:
            name: Access-Control-Allow-Credentials Access-Control-Allow-Origin

  # Exclude auto-configurations
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcTransactionManagerAutoConfiguration

# CORS Configuration
cors:
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# JWT
jwt:
  secret: ${JWT_SECRET}

# Logging
logging:
  level:
    com.godayana: DEBUG
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO
    org.springframework.web.reactive.function.client: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Management / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    gateway:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: TIME_BASED
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.cloud.gateway.support.NotFoundException
    instances:
      authService:
        base-config: default
        wait-duration-in-open-state: 10s
      otpService:
        base-config: default
        wait-duration-in-open-state: 30s
      userService:
        base-config: default
        wait-duration-in-open-state: 20s
      jobService:
        base-config: default
        wait-duration-in-open-state: 20s
      courseService:
        base-config: default
        wait-duration-in-open-state: 20s
      visaService:
        base-config: default
        wait-duration-in-open-state: 20s

  timelimiter:
    configs:
      default:
        timeout-duration: 30s
    instances:
      authService:
        timeout-duration: 30s
      otpService:
        timeout-duration: 120s
      userService:
        timeout-duration: 30s
      jobService:
        timeout-duration: 30s
      courseService:
        timeout-duration: 30s
      visaService:
        timeout-duration: 30s
      fileService:
        timeout-duration: 60s

  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.HttpServerErrorException
        exponential-backoff-multiplier: 2
    instances:
      authService:
        max-attempts: 2
        wait-duration: 500ms
      otpService:
        max-attempts: 1
        wait-duration: 2s
      userService:
        max-attempts: 3
        wait-duration: 1s
      jobService:
        max-attempts: 3
        wait-duration: 1s
      courseService:
        max-attempts: 3
        wait-duration: 1s
      visaService:
        max-attempts: 3
        wait-duration: 1s
      fileService:
        max-attempts: 5
        wait-duration: 2s